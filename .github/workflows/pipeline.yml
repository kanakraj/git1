name: CI-WORKFLOW

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Select system logging verbosity'
        required: true
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
      run_tests:
        description: 'Execute test suite before deployment?'
        required: true
        default: true
        type: boolean

jobs:
  build-test:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: build
        run: npm install

      - name: test
        run: npm test

      - name: Artifact upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-1
          path: |
            package*

      - name: deploy
        run: echo "my code is deployed"
