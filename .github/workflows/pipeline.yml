name: NodeJs

on:
  push:
    branches:
      - main
      - dev

permissions:
  security-events: write
  issues: write
  actions: read
  contents: read

jobs:
  build:
    #if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for JavaScript/TypeScript files
        id: check-js
        shell: bash
        run: |
          if git ls-files '*.js' '*.ts' | grep -q .; then
          echo "has_js=true" >> "$GITHUB_OUTPUT"
          else
          echo "has_js=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.check-js.outputs.has_js == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
    
      - name: Perform CodeQL Analysis
        if: steps.check-js.outputs.has_js == 'true'
        uses: github/codeql-action/analyze@v3
    
      - name: Build
        run: npm install
    
      - name: Upload file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-data
          path: ~/.npm

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

      - name: Test
        run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy
        run: echo "My code is deployed !!"
