name: NodeJs

on:
  push:
    branches:
      - main

permissions:
  security-events: write
  issues: write
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm install

      - name: Test
        run: npm test

      - name: Deploy
        run: echo "My code is deployed"
