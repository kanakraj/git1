name: NodeJs

on:
  push:
    branches:
      - main

permissions:
  security-events: write
  issues: write
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Test
        run: npm test
        working-directory: .

      - name: Deploy
        run: echo "My code is deployed"
